<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Sharzhukov Account</title>
<meta name="theme-color" content="#ff5c1f">
<style>
:root{--orange:#ff5c1f;--border:#0a0b12;--muted:#64748b;--bg:#ffffff;--fg:#0a0b12}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;background-image:linear-gradient(rgba(10,11,18,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(10,11,18,.05) 1px,transparent 1px);background-size:40px 40px}
.wrap{max-width:560px;width:100%}
.marker{display:inline-block;background:var(--border);color:#fff;font-family:ui-monospace,'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;padding:6px 10px;margin-bottom:24px}
h1{font-size:clamp(2rem,6vw,3rem);letter-spacing:-.04em;line-height:1;margin:0 0 16px;font-weight:900}
p{color:var(--muted);font-size:16px;line-height:1.6;margin:0 0 28px;max-width:480px}
pre{background:#0a0b12;color:#e5e7eb;border:3px solid var(--border);box-shadow:6px 6px 0 var(--orange);padding:14px 18px;font-family:ui-monospace,monospace;font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:8px;margin:0 0 32px}
.pre-prompt{color:var(--orange)}
button{background:var(--orange);color:#fff;border:3px solid var(--border);box-shadow:4px 4px 0 var(--border);padding:14px 24px;font-family:ui-monospace,monospace;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
button:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--border)}
button:active{transform:translate(0,0);box-shadow:2px 2px 0 var(--border)}
</style>
</head>
<body>
<div class="wrap">
    <span class="marker">// OFFLINE</span>
    <h1>You're offline.</h1>
    <p>No internet connection. Cached pages remain accessible — check the connection and try again.</p>
    <pre><span class="pre-prompt">$</span> ping sharzhukov.com<span style="color:var(--orange);animation:blink 1s steps(2) infinite">_</span></pre>
    <div>
        <button onclick="location.reload()">Retry connection →</button>
    </div>
</div>
<style>@keyframes blink{50%{opacity:0}}</style>
<script>
    window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
